[project]
name = "grok-bridge-worker"
version = "0.1.0"
description = "Mistral Workflows worker: ask-grok bridge to the xAI API"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
