name: ask-grok
on:
  push:
    paths:
      - "requests/*.json"

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask Grok
        env:
          AI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          mkdir -p answers
          python3 - <<'PY'
          import glob, json, os, re, traceback, urllib.request, urllib.error

          PROVIDERS = {
              "xai-": ("https://api.x.ai/v1", "grok-4.7"),
              "gsk_": ("https://api.groq.com/openai/v1", "llama-3.3-70b-versatile"),
              "AIza": ("https://generativelanguage.googleapis.com/v1beta/openai", "gemini-2.5-flash"),
              "AQ.": ("https://generativelanguage.googleapis.com/v1beta/openai", "gemini-2.5-flash"),
          }

          diag = []
          try:
              req_file = sorted(glob.glob("requests/*.json"))[-1]
              with open(req_file) as f:
                  spec = json.load(f)
              messages = []
              if spec.get("system"):
                  messages.append({"role": "system", "content": spec["system"]})
              messages.extend(spec.get("history") or [])
              messages.append({"role": "user", "content": spec["message"]})

              key = os.environ["AI_API_KEY"].strip()
              m = re.search(r"(AQ\.[A-Za-z0-9_\-\.]+|xai-|gsk_|AIza)[A-Za-z0-9_\-]*", key)
              if m:
                  key = m.group(0)
              diag.append("key_len=%d key_ascii=%s prefix=%s" % (len(key), key.isascii(), key[:4]))

              if spec.get("provider") == "pollinations":
                  base_url, default_model, with_key = "https://text.pollinations.ai/openai", "openai", False
              else:
                  base_url, default_model = next(
                      (v for k, v in PROVIDERS.items() if key.startswith(k)),
                      (None, None),
                  )
                  if base_url is None:
                      base_url, default_model, with_key = "https://text.pollinations.ai/openai", "openai", False
                  else:
                      with_key = True
              base_url = spec.get("base_url", base_url)
              model = spec.get("model", default_model)
              diag.append("base_url=%s model=%s" % (base_url, model))

              headers = {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "grok-bridge/0.3",
              }
              if with_key:
                  headers["Authorization"] = "Bearer " + key
              req = urllib.request.Request(
                  base_url.rstrip("/") + "/chat/completions",
                  data=json.dumps({"model": model, "messages": messages}).encode("utf-8"),
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=240) as r:
                  data = json.load(r)
              answer = data["choices"][0]["message"]["content"]
          except urllib.error.HTTPError as e:
              body = ""
              try:
                  body = e.read().decode("utf-8", errors="replace")[:2000]
              except Exception:
                  pass
              answer = "HTTP_ERROR %s\nBODY: %s" % (e.code, body)
          except Exception as e:
              answer = "ERROR: " + type(e).__name__ + ": " + str(e)[:500] + "\n\nDIAG:\n" + "\n".join(diag) + "\n\nTRACEBACK:\n" + traceback.format_exc()[:3000]

          ts = os.environ.get("GITHUB_RUN_ID", "local")
          with open(f"answers/{ts}.md", "w", encoding="utf-8") as f:
              f.write((answer or "").strip() or "(empty answer)")
          PY

      - name: Commit answer
        run: |
          git config user.name "grok-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add answers
          git commit -m "ai answer (run ${{ github.run_id }})"
          git pull --rebase origin main
          git push
