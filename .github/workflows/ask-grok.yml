name: ask-grok
on:
  push:
    paths:
      - "requests/*.json"

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask Grok
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          mkdir -p answers
          python3 - <<'PY'
          import glob, json, os, re, traceback, urllib.request, urllib.error

          diag = []
          try:
              req_file = sorted(glob.glob("requests/*.json"))[-1]
              with open(req_file) as f:
                  spec = json.load(f)
              messages = []
              if spec.get("system"):
                  messages.append({"role": "system", "content": spec["system"]})
              messages.extend(spec.get("history") or [])
              messages.append({"role": "user", "content": spec["message"]})

              key = os.environ["XAI_API_KEY"].strip()
              m = re.search(r"xai-[A-Za-z0-9]+", key)
              if m:
                  key = m.group(0)
              diag.append("key_len=%d key_ascii=%s" % (len(key), key.isascii()))

              req = urllib.request.Request(
                  "https://api.x.ai/v1/chat/completions",
                  data=json.dumps({
                      "model": spec.get("model", "grok-4.7"),
                      "messages": messages,
                  }).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=240) as r:
                  data = json.load(r)
              answer = data["choices"][0]["message"]["content"]
          except Exception as e:
              answer = "ERROR: " + type(e).__name__ + ": " + str(e)[:500] + "\n\nDIAG:\n" + "\n".join(diag) + "\n\nTRACEBACK:\n" + traceback.format_exc()[:3000]

          ts = os.environ.get("GITHUB_RUN_ID", "local")
          with open(f"answers/{ts}.md", "w", encoding="utf-8") as f:
              f.write(answer)
          PY

      - name: Commit answer
        run: |
          git config user.name "grok-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add answers
          git commit -m "grok answer (run ${{ github.run_id }})"
          git pull --rebase origin main
          git push
