name: ask-grok
on:
  push:
    paths:
      - "requests/*.json"

permissions:
  contents: write

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask Grok
        env:
          AI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GEMINI_API_KEY || secrets.Gemini || secrets.GROK_API_KEY }}
        run: |
          mkdir -p answers
          python3 - <<'PY'
          import glob, json, os, re, traceback, urllib.request, urllib.error

          PROVIDERS = {
              "xai-": ("https://api.x.ai/v1", "grok-4.7"),
              "gsk_": ("https://api.groq.com/openai/v1", "llama-3.3-70b-versatile"),
              "AIza": ("https://generativelanguage.googleapis.com/v1beta/openai", "gemini-3.8-flash"),
              "AQ.": ("https://generativelanguage.googleapis.com/v1beta/openai", "gemini-3.8-flash"),
          }

          diag = []
          try:
              req_file = sorted(glob.glob("requests/*.json"))[-1]
              with open(req_file) as f:
                  spec = json.load(f)
              messages = []
              if spec.get("system"):
                  messages.append({"role": "system", "content": spec["system"]})
              messages.extend(spec.get("history") or [])
              messages.append({"role": "user", "content": spec["message"]})

              key = os.environ["AI_API_KEY"].strip()
              m = re.search(r"(AQ\.[A-Za-z0-9_\-\.]+|xai-|gsk_|AIza)[A-Za-z0-9_\-]*", key)
              if m:
                  key = m.group(0)
              diag.append("key_len=%d key_ascii=%s prefix=%s" % (len(key), key.isascii(), key[:4]))

              base_url, default_model = next(
                  (v for k, v in PROVIDERS.items() if key.startswith(k)),
                  (None, None),
              )
              if base_url is None:
                  base_url, default_model, with_key = "https://text.pollinations.ai/openai", "openai", False
              else:
                  with_key = True
              if spec.get("provider") == "pollinations":
                  base_url, default_model, with_key = "https://text.pollinations.ai/openai", "openai", False
              base_url = spec.get("base_url", base_url)
              model = spec.get("model", default_model)
              diag.append("base_url=%s model=%s" % (base_url, model))

              import time
              attempts = [(base_url, model, with_key)]
              if with_key:
                  attempts.append(("https://text.pollinations.ai/openai", "openai", False))

              answer = None
              last_error = ""
              for url, mdl, wk in attempts:
                  for attempt in range(2):
                      headers = {
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "grok-bridge/0.4",
                      }
                      if wk:
                          headers["Authorization"] = "Bearer " + key
                      req = urllib.request.Request(
                          url.rstrip("/") + "/chat/completions",
                          data=json.dumps({"model": mdl, "messages": messages}).encode("utf-8"),
                          headers=headers,
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=600) as r:
                              data = json.load(r)
                          answer = data["choices"][0]["message"]["content"]
                          break
                      except urllib.error.HTTPError as e:
                          body = ""
                          try:
                              body = e.read().decode("utf-8", errors="replace")[:1000]
                          except Exception:
                              pass
                          last_error = "HTTP_ERROR %s at %s: %s" % (e.code, url, body)
                          if e.code < 500:
                              break
                      except Exception as e:
                          last_error = "ERROR %s at %s: %s" % (type(e).__name__, url, str(e)[:500])
                  if answer:
                      break
                  diag.append(last_error)
                  time.sleep(15)
              if not answer:
                  answer = "NO_ANSWER\n" + "\n".join(diag)
          except Exception as e:
              answer = "FATAL: " + type(e).__name__ + ": " + str(e)[:300]

          ts = os.environ.get("GITHUB_RUN_ID", "local")
          with open(f"answers/{ts}.md", "w", encoding="utf-8") as f:
              f.write((answer or "").strip() or "(empty answer)")
          PY

      - name: Commit answer
        run: |
          git config user.name "grok-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add answers
          git commit -m "ai answer (run ${{ github.run_id }})"
          git pull --rebase origin main
          git push
